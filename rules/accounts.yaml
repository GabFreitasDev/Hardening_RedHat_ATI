# Regras de contas e arquivos de autenticação (trilha do Aluno B, dor 6 - mínimo privilégio).
# Formato e campos: docs/CONTRATO.md
#
# Atenção: no YAML, "no"/"yes" e modos de arquivo (ex.: "0644") SEMPRE entre aspas.
# Atenção: o campo `referencia` só deixa de ser "A CONFIRMAR" depois de conferir o item
# no CIS Benchmark oficial do RHEL 9 (não usar numeração de memória).

- id: PERM-002
  descricao: Permissões de /etc/passwd
  referencia: "CIS RHEL 9 - Permissões de /etc/passwd (A CONFIRMAR o item no benchmark)"
  dor_ati: [6]
  severidade: alta
  plataforma: rhel9
  primitiva: permissao_arquivo
  parametros:
    caminho: /etc/passwd
    modo_max: "0644"
    dono: root
    grupo: root
  # valores a confirmar na VM com stat -c '%a %U:%G' e no benchmark

- id: PERM-003
  descricao: Permissões de /etc/shadow
  referencia: "CIS RHEL 9 - Permissões de /etc/shadow (A CONFIRMAR o item no benchmark)"
  dor_ati: [6]
  severidade: alta
  plataforma: rhel9
  primitiva: permissao_arquivo
  parametros:
    caminho: /etc/shadow
    modo_max: "0000"
    dono: root
    grupo: root
  # valores a confirmar na VM com stat -c '%a %U:%G' e no benchmark

- id: PAM-001
  descricao: Limite de tentativas de autenticação inválidas (deny) no faillock
  referencia: "CIS RHEL 9 - PAM faillock deny (A CONFIRMAR o item no benchmark)"
  dor_ati: [6]
  severidade: alta
  plataforma: rhel9
  primitiva: arquivo_chave_valor
  parametros:
    arquivo: /etc/security/faillock.conf
    chave: deny
    valor: "5"  # VALOR A CONFIRMAR no benchmark oficial

- id: PAM-001b
  descricao: Tempo de bloqueio de conta (unlock_time) no faillock
  referencia: "CIS RHEL 9 - PAM faillock unlock_time (A CONFIRMAR o item no benchmark)"
  dor_ati: [6]
  severidade: alta
  plataforma: rhel9
  primitiva: arquivo_chave_valor
  parametros:
    arquivo: /etc/security/faillock.conf
    chave: unlock_time
    valor: "900"  # VALOR A CONFIRMAR no benchmark oficial

- id: PAM-002
  descricao: Tamanho mínimo de senha (minlen) no pwquality
  referencia: "CIS RHEL 9 - PAM pwquality minlen (A CONFIRMAR o item no benchmark)"
  dor_ati: [6]
  severidade: alta
  plataforma: rhel9
  primitiva: arquivo_chave_valor
  parametros:
    arquivo: /etc/security/pwquality.conf
    chave: minlen
    valor: "14"  # VALOR A CONFIRMAR no benchmark oficial

- id: ACC-002
  descricao: Máscara padrão de criação de arquivos (UMASK) em login.defs
  referencia: "CIS RHEL 9 - UMASK padrão (A CONFIRMAR o item no benchmark)"
  dor_ati: [6]
  severidade: alta
  plataforma: rhel9
  primitiva: arquivo_chave_valor
  parametros:
    arquivo: /etc/login.defs
    chave: UMASK
    valor: "027"  # VALOR A CONFIRMAR no benchmark oficial
    separador: " "

- id: SUDO-001
  descricao: Proibir NOPASSWD indevido em sudoers e sudoers.d
  referencia: "CIS RHEL 9 - Sudo sem NOPASSWD (A CONFIRMAR o item no benchmark)"
  dor_ati: [6]
  severidade: critica
  plataforma: rhel9
  primitiva: sudoers
  parametros:
    proibir: nopasswd
  recarregar: sudoers

- id: SUDO-002
  descricao: Proibir ALL indevido para quem não for root ou wheel em sudoers
  referencia: "CIS RHEL 9 - Sudo restrito a root e wheel (A CONFIRMAR o item no benchmark)"
  dor_ati: [6]
  severidade: alta
  plataforma: rhel9
  primitiva: sudoers
  parametros:
    proibir: all
    permitidos:
      - root
      - "%wheel"
  recarregar: sudoers

- id: SUDO-003
  descricao: Restringir membros do grupo wheel aos administradores autorizados
  referencia: "CIS RHEL 9 - Grupo wheel restrito (A CONFIRMAR o item no benchmark)"
  dor_ati: [6]
  severidade: alta
  plataforma: rhel9
  primitiva: conta_usuario
  parametros:
    modo: membros_grupo
    grupo: wheel
    permitidos:  # alinhar com demo/dados/autorizados.csv
      - root
      - admin_ati
      - secops

- id: ACC-001
  descricao: UID 0 atribuído exclusivamente à conta root
  referencia: "CIS RHEL 9 - UID 0 exclusivo para root (A CONFIRMAR o item no benchmark)"
  dor_ati: [6]
  severidade: critica
  plataforma: rhel9
  primitiva: conta_usuario
  parametros:
    modo: uid0_unico
  # somente_auditoria: true  # Aguarda definição/suporte do campo pelo Aluno A no motor

